[project]
name = "embr-ml-worker"
version = "0.1.0"
description = "Isolated CLI worker for Embr Pybox ML jobs (MatAnyone2 / SAM2)."
readme = "README.md"
requires-python = ">=3.10"
# Media stack used by prepare_frames / publish_cache / hud-overlay (no torch).
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "OpenEXR>=3.2",
]

[project.optional-dependencies]
# Torch + MatAnyone2 are heavy / platform-specific — install after base setup:
#   uv pip install torch torchvision
#   uv pip install -e "$EMBR_ML_ROOT/src/MatAnyone2"
#   # or: uv pip install "matanyone2 @ git+https://github.com/pq-yang/MatAnyone2.git"
matte = []

[project.scripts]
embr-ml = "embr_ml.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["embr_ml"]
