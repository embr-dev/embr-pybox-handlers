[project]
name = "embr-ml-worker"
version = "0.1.0"
description = "Isolated CLI worker for Embr Pybox ML jobs (MatAnyone2 / SAM2)."
readme = "README.md"
requires-python = ">=3.10"
# Keep default deps empty so Setup / ensure-models work with stdlib only.
dependencies = []

[project.optional-dependencies]
# Install MatAnyone2 separately on Linux CUDA, e.g.:
#   uv pip install "matanyone2 @ git+https://github.com/pq-yang/MatAnyone2.git"
matte = []

[project.scripts]
embr-ml = "embr_ml.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["embr_ml"]
